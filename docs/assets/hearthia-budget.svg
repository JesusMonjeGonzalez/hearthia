<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="920" height="430" fill="#100E0B" rx="14"/>
  <text x="40" y="46" fill="#E8A33D" font-size="17" font-weight="bold">WHY HEARTHIA EXISTS — unified memory is a shared budget</text>
  <text x="40" y="68" fill="#8a8071" font-size="11">Measured on a 36 GB Apple Silicon Mac. One check at a time fits; together they froze the machine.</text>

  <!-- Panel 1: the incident -->
  <text x="40" y="110" fill="#d8cfbf" font-size="13" font-weight="bold">Three models, warmed one by one — all "fit"</text>

  <text x="40" y="140" fill="#8a8071" font-size="11">35B chat + embeddings + autocomplete, resident together</text>
  <rect x="40" y="150" width="760" height="26" fill="#1a1712"/>
  <rect x="40" y="150" width="721" height="26" fill="#E83D3D"/>
  <rect x="685" y="146" width="3" height="34" fill="#E8A33D"/>
  <text x="770" y="168" fill="#E8A33D" font-size="11" font-weight="bold">24.0 wired ceiling</text>
  <text x="48" y="167" fill="#100E0B" font-size="12" font-weight="bold">26.7 GiB requested</text>

  <text x="40" y="205" fill="#8a8071" font-size="11">With Hearthia: the third warm is refused before it loads</text>
  <rect x="40" y="215" width="515" height="26" fill="#1a1712"/>
  <rect x="40" y="215" width="506" height="26" fill="#E8A33D"/>
  <rect x="685" y="211" width="3" height="34" fill="#E8A33D"/>
  <text x="554" y="233" fill="#E8A33D" font-size="11" font-weight="bold">18.3 GiB — under the ceiling</text>

  <!-- Panel 2: KV cache scaling -->
  <text x="40" y="290" fill="#d8cfbf" font-size="13" font-weight="bold">KV cache per 1K context tokens — same file size, tenfold cost</text>

  <text x="40" y="320" fill="#8a8071" font-size="11">gemma-class 12B (42 layers, wide heads)</text>
  <rect x="40" y="330" width="760" height="22" fill="#1a1712"/>
  <rect x="40" y="330" width="760" height="22" fill="#E8753D"/>
  <text x="48" y="345" fill="#100E0B" font-size="12" font-weight="bold">408 MB / 1K tokens</text>

  <text x="40" y="380" fill="#8a8071" font-size="11">Qwen3.6-35B-A3B MoE (48 layers, 4 KV heads)</text>
  <rect x="40" y="390" width="760" height="22" fill="#1a1712"/>
  <rect x="40" y="390" width="79" height="22" fill="#E8A33D"/>
  <text x="127" y="405" fill="#E8A33D" font-size="12" font-weight="bold">42.5 MB / 1K tokens</text>
</svg>
