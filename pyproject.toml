[project]
name = "hearthia"
version = "0.1.0"
description = "The self-tending fire for local models — a control plane for llama.cpp on Apple Silicon."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "psutil>=7",
    "pydantic-settings>=2.6",
    "ruamel.yaml>=0.18",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
hearth = "hearthia.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
