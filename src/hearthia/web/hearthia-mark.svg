<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1510"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset=".45" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#c05a1d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cd"/>
      <stop offset="1" stop-color="#ffcf6e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".55">
      <stop offset="0" stop-color="#e8a33d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="7" y="7" width="498" height="498" rx="105" fill="none" stroke="#e8a33d" stroke-opacity=".14" stroke-width="3"/>
  <circle cx="256" cy="300" r="196" fill="url(#glow)"/>

  <!-- neural constellation: synapses rising out of the fire (the AI half) -->
  <path d="M256 118 L198 86 M256 118 L314 92 M198 86 L228 58 M228 58 L314 92"
        fill="none" stroke="#e8a33d" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="228" cy="58" r="4.5" fill="#fff3cd" opacity=".85"/>
  <circle cx="198" cy="86" r="6" fill="#e8a33d"/>
  <circle cx="314" cy="92" r="6" fill="#e8a33d"/>
  <circle cx="256" cy="118" r="8" fill="#fff3cd"/>

  <!-- hearth arch -->
  <path d="M148 412 V252 a108 108 0 0 1 216 0 V412" fill="none"
        stroke="#e8a33d" stroke-width="30" stroke-linecap="round"/>

  <!-- flame with a heart core (the Hearthia heart) -->
  <path d="M256 172 C270 216 204 252 204 312 a52 52 0 0 0 104 0 C308 252 242 216 256 172 Z"
        fill="url(#flame)"/>
  <path d="M256 362 C236 346 217 333 217 316 C217 303 225 294 236 294 C244 294 251 298 256 306
           C261 298 268 294 276 294 C287 294 295 303 295 316 C295 333 276 346 256 362 Z"
        fill="url(#core)"/>
  <circle cx="256" cy="322" r="5.5" fill="#c05a1d"/>
</svg>
